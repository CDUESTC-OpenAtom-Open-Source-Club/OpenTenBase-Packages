name: Build Multi-Distro DEB Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenTenBase version (5.0, 2.6.0, 2.5.0)'
        required: true
        default: '5.0'
        type: choice
        options:
          - '5.0'
          - '2.6.0'
          - '2.5.0'
      distro:
        description: 'Build specific distro (leave empty for all)'
        required: false
        type: choice
        options:
          - ''
          - ubuntu-20.04
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-25.04
          - debian-11
          - debian-12
          - debian-13

jobs:
  # Setup: determine OpenTenBase version
  setup:
    runs-on: ubuntu-latest
    outputs:
      otb_version: ${{ steps.version.outputs.otb_version }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_REF: ${{ github.ref }}
        run: |
          # Priority: workflow_dispatch input > tag ref > default
          if [ -n "$INPUT_VERSION" ]; then
            OTB_VERSION="$INPUT_VERSION"
          elif [[ "$TAG_REF" == refs/tags/v* ]]; then
            # Extract version from tag (e.g., v5.0-p33 -> 5.0)
            OTB_VERSION=$(echo "$TAG_REF" | sed 's|^refs/tags/v||' | cut -d'-' -f1)
          else
            OTB_VERSION="5.0"
          fi
          echo "otb_version=$OTB_VERSION" >> $GITHUB_OUTPUT
          echo "Building OpenTenBase version: $OTB_VERSION"

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            version: "20.04"
            codename: focal
            dockerfile: docker/build/docker-ubuntu-20.04.Dockerfile
          - distro: ubuntu
            version: "22.04"
            codename: jammy
            dockerfile: docker/build/docker-ubuntu-22.04.Dockerfile
          - distro: ubuntu
            version: "24.04"
            codename: noble
            dockerfile: docker/build/docker-ubuntu-24.04.Dockerfile
          - distro: debian
            version: "11"
            codename: bullseye
            dockerfile: docker/build/docker-debian-11.Dockerfile
          - distro: debian
            version: "12"
            codename: bookworm
            dockerfile: docker/build/docker-debian-12.Dockerfile
          - distro: ubuntu
            version: "25.04"
            codename: plucky
            dockerfile: docker/build/docker-ubuntu-25.04.Dockerfile
          - distro: debian
            version: "13"
            codename: trixie
            dockerfile: docker/build/docker-debian-13.Dockerfile

    steps:
      - name: Check if should build
        id: check
        env:
          INPUT_DISTRO: ${{ github.event.inputs.distro }}
          MATRIX_KEY: ${{ matrix.distro }}-${{ matrix.version }}
        run: |
          if [ -z "$INPUT_DISTRO" ] || [ "$INPUT_DISTRO" = "$MATRIX_KEY" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout packaging repo
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          path: packaging

      - name: Checkout OpenTenBase source
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          repository: OpenTenBase/OpenTenBase
          ref: v${{ needs.setup.outputs.otb_version }}
          path: source
          fetch-depth: 1

      - name: Merge packaging into source
        if: steps.check.outputs.should_build == 'true'
        run: |
          mkdir -p source/debian
          cp -a packaging/debian/* source/debian/
          cp -a packaging/config source/
          cp -a packaging/patches source/debian/
          cp -a packaging/scripts source/

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: steps.check.outputs.should_build == 'true'
        run: |
          docker build \
            --file packaging/${{ matrix.dockerfile }} \
            --tag opentenbase-builder:${{ matrix.distro }}-${{ matrix.version }} \
            .

      - name: Build packages
        if: steps.check.outputs.should_build == 'true'
        run: |
          docker run \
            --volume $(pwd)/source:/source \
            --volume $(pwd)/output:/output \
            opentenbase-builder:${{ matrix.distro }}-${{ matrix.version }}

      - name: Verify packages
        if: steps.check.outputs.should_build == 'true'
        run: |
          for deb in output/*.deb; do
            echo "=== $(basename $deb) ==="
            dpkg-deb -I "$deb" | head -15
            echo
          done

      - name: Rename packages with codename
        if: steps.check.outputs.should_build == 'true'
        run: |
          sudo chown -R $(id -u):$(id -g) output/
          cd output
          for deb in *.deb; do
            # Extract version from package name (e.g., opentenbase_5.0-1ubuntu1_amd64.deb -> 5.0-1ubuntu1)
            PKG_VER=$(echo "$deb" | sed -n 's/.*_\([0-9.]*-[0-9]*ubuntu[0-9]*\)_.*/\1/p')
            if [ -n "$PKG_VER" ]; then
              newname=$(echo "$deb" | sed "s/_${PKG_VER}_/_${PKG_VER}~${{ matrix.codename }}_/")
              if [ "$newname" != "$deb" ]; then
                mv "$deb" "$newname"
                echo "Renamed: $deb -> $newname"
              fi
            fi
          done
          ls -la *.deb

      - name: Upload artifacts
        if: steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ needs.setup.outputs.otb_version }}-${{ matrix.distro }}-${{ matrix.codename }}
          path: output/*.deb
          retention-days: 30

  # Test each distro after build
  test:
    needs: [setup, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            version: "20.04"
            codename: focal
          - distro: ubuntu
            version: "22.04"
            codename: jammy
          - distro: ubuntu
            version: "24.04"
            codename: noble
          - distro: ubuntu
            version: "25.04"
            codename: plucky
          - distro: debian
            version: "11"
            codename: bullseye
          - distro: debian
            version: "12"
            codename: bookworm
          - distro: debian
            version: "13"
            codename: trixie

    steps:
      - name: Check if should test
        id: check
        env:
          INPUT_DISTRO: ${{ github.event.inputs.distro }}
          MATRIX_KEY: ${{ matrix.distro }}-${{ matrix.version }}
        run: |
          if [ -z "$INPUT_DISTRO" ] || [ "$INPUT_DISTRO" = "$MATRIX_KEY" ]; then
            echo "should_test=true" >> $GITHUB_OUTPUT
          else
            echo "should_test=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repo
        if: steps.check.outputs.should_test == 'true'
        uses: actions/checkout@v4

      - name: Download packages
        if: steps.check.outputs.should_test == 'true'
        uses: actions/download-artifact@v4
        with:
          name: debs-${{ needs.setup.outputs.otb_version }}-${{ matrix.distro }}-${{ matrix.codename }}
          path: packages/

      - name: Run smoke test in Docker
        if: steps.check.outputs.should_test == 'true'
        run: |
          cat > Dockerfile.test << EOF
          FROM ${{ matrix.distro }}:${{ matrix.version }}
          ENV DEBIAN_FRONTEND=noninteractive

          RUN apt-get update && apt-get install -y \
              sudo procps libatomic1 adduser \
              libxml2 libreadline8 \
              libpam0g liblz4-1 libzstd1 libcurl4 \
              libsasl2-2 openssh-server openssh-client \
              && (apt-get install -y libpqxx-dev 2>/dev/null || true) \
              && (apt-get install -y libssl1.1 2>/dev/null || apt-get install -y libssl3 2>/dev/null || true) \
              && (apt-get install -y libldap-2.4-2 2>/dev/null || apt-get install -y libldap-2.5-0 2>/dev/null || apt-get install -y libldap-common 2>/dev/null || true) \
              && rm -rf /var/lib/apt/lists/*

          COPY packages/*.deb /tmp/debs/
          RUN dpkg --force-depends -i /tmp/debs/*.deb
          RUN mkdir -p /usr/lib/opentenbase/${{ needs.setup.outputs.otb_version }}/lib/postgresql
          RUN ldconfig || true
          # Ensure opentenbase user exists with proper shell and home
          RUN id opentenbase 2>/dev/null || (addgroup --system opentenbase && adduser --system --ingroup opentenbase --home /var/lib/opentenbase --shell /bin/bash opentenbase)
          RUN mkdir -p /var/lib/opentenbase/${{ needs.setup.outputs.otb_version }} /var/log/opentenbase/${{ needs.setup.outputs.otb_version }} /var/run/opentenbase
          RUN chown -R opentenbase:opentenbase /var/lib/opentenbase/${{ needs.setup.outputs.otb_version }} /var/log/opentenbase/${{ needs.setup.outputs.otb_version }} /var/run/opentenbase 2>/dev/null || true
          # Set up passwordless SSH for opentenbase user (required by opentenbase_ctl)
          RUN mkdir -p /var/lib/opentenbase/.ssh /root/.ssh && \
              ssh-keygen -t ed25519 -f /root/.ssh/id_ed25519 -N "" -q && \
              cp /root/.ssh/id_ed25519 /var/lib/opentenbase/.ssh/id_ed25519 && \
              cp /root/.ssh/id_ed25519.pub /var/lib/opentenbase/.ssh/id_ed25519.pub && \
              cp /root/.ssh/id_ed25519.pub /root/.ssh/authorized_keys && \
              cp /root/.ssh/id_ed25519.pub /var/lib/opentenbase/.ssh/authorized_keys && \
              chmod 700 /root/.ssh /var/lib/opentenbase/.ssh && \
              chmod 600 /root/.ssh/authorized_keys /var/lib/opentenbase/.ssh/authorized_keys && \
              chown -R opentenbase:opentenbase /var/lib/opentenbase/.ssh && \
              echo "opentenbase ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers && \
              echo "StrictHostKeyChecking no" >> /etc/ssh/ssh_config

          COPY test/smoke-test.sh /test/
          RUN chmod +x /test/smoke-test.sh

          CMD ["/test/smoke-test.sh"]
          EOF

          docker build -f Dockerfile.test -t opentenbase-test:${{ matrix.codename }} .
          docker run --rm --cap-add SYS_PTRACE opentenbase-test:${{ matrix.codename }} || {
            echo "=== Smoke test failed, checking GTM log ==="
            docker run --rm --cap-add SYS_PTRACE opentenbase-test:${{ matrix.codename }} bash -c "
              /test/smoke-test.sh 2>&1 || true
              echo '=== GTM Log ==='
              cat /var/log/opentenbase/${{ needs.setup.outputs.otb_version }}/gtm.log 2>/dev/null || echo 'No GTM log found'
              echo '=== GTM Config ==='
              cat /var/lib/opentenbase/${{ needs.setup.outputs.otb_version }}/gtm/gtm.conf 2>/dev/null || echo 'No GTM config found'
            "
            exit 1
          }

  release:
    needs: [setup, build, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-debs

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            all-debs/**/*.deb
            scripts/install.sh
