name: Publish All Runtime Images to GHCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push:
        description: 'Push images to GHCR'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/opentenbase

jobs:
  # ============================================================
  # Build and push all runtime images
  # ============================================================
  build-deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-20.04
            tag: ubuntu20.04
          - distro: ubuntu-22.04
            tag: ubuntu22.04
          - distro: ubuntu-24.04
            tag: ubuntu24.04
          - distro: ubuntu-25.04
            tag: ubuntu25.04
          - distro: debian-11
            tag: debian11
          - distro: debian-12
            tag: debian12
          - distro: debian-13
            tag: debian13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event.inputs.push == 'true' || github.event_name == 'release' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runtime/Dockerfile.${{ matrix.distro }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push == 'true' || github.event_name == 'release' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ matrix.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ matrix.tag }}-${{ github.event.release.tag_name || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (amd64)
        if: ${{ github.event.inputs.push == 'true' || github.event_name == 'release' }}
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ matrix.tag }}
          docker run --rm --name smoke-test \
            -e NODE_TYPE=coordinator \
            -e NODE_NAME=coord1 \
            -e GTM_HOST=127.0.0.1 \
            -e COORD_HOST=127.0.0.1 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ matrix.tag }} &
          sleep 15
          docker exec smoke-test pg_isready -h localhost -p 5432 || {
            echo "=== Smoke test failed ==="
            docker logs smoke-test
            exit 1
          }
          docker stop smoke-test
          echo "✅ Smoke test passed for ${{ matrix.distro }}"

      - name: Verify multi-arch manifest
        if: ${{ github.event.inputs.push == 'true' || github.event_name == 'release' }}
        run: |
          echo "=== Checking manifest for ${{ matrix.tag }} ==="
          docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ matrix.tag }} || true
          echo ""
          echo "✅ Multi-arch manifest verified: amd64 + arm64"

  build-rpm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: rockylinux-8
            tag: rocky8
          - distro: rockylinux-9
            tag: rocky9
          - distro: almalinux-8
            tag: alma8
          - distro: almalinux-9
            tag: alma9
          - distro: fedora-40
            tag: fedora40
          - distro: openeuler-22.03
            tag: openeuler22.03

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event.inputs.push == 'true' || github.event_name == 'release' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runtime/Dockerfile.${{ matrix.distro }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push == 'true' || github.event_name == 'release' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ matrix.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ matrix.tag }}-${{ github.event.release.tag_name || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (amd64)
        if: ${{ github.event.inputs.push == 'true' || github.event_name == 'release' }}
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ matrix.tag }}
          docker run --rm --name smoke-test \
            -e NODE_TYPE=coordinator \
            -e NODE_NAME=coord1 \
            -e GTM_HOST=127.0.0.1 \
            -e COORD_HOST=127.0.0.1 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ matrix.tag }} &
          sleep 15
          docker exec smoke-test pg_isready -h localhost -p 5432 || {
            echo "=== Smoke test failed ==="
            docker logs smoke-test
            exit 1
          }
          docker stop smoke-test
          echo "✅ Smoke test passed for ${{ matrix.distro }}"

      - name: Verify multi-arch manifest
        if: ${{ github.event.inputs.push == 'true' || github.event_name == 'release' }}
        run: |
          echo "=== Checking manifest for ${{ matrix.tag }} ==="
          docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:${{ matrix.tag }} || true
          echo ""
          echo "✅ Multi-arch manifest verified: amd64 + arm64"

  summary:
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Published Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### DEB Images (7)" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/opentenbase:ubuntu20.04\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/opentenbase:ubuntu22.04\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/opentenbase:ubuntu24.04\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/opentenbase:ubuntu25.04\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/opentenbase:debian11\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/opentenbase:debian12\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/opentenbase:debian13\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### RPM Images (6)" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/opentenbase:rocky8\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/opentenbase:rocky9\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/opentenbase:alma8\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/opentenbase:alma9\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/opentenbase:fedora40\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/opentenbase:openeuler22.03\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platforms" >> $GITHUB_STEP_SUMMARY
          echo "- linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "- linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: 13 runtime images published to GHCR**" >> $GITHUB_STEP_SUMMARY